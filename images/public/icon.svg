  <!-- Luxury Obsidian Squircle with Radiant Gold Rim -->
  <rect x="14" y="14" width="484" height="484" rx="120" fill="url(#obsidianBg)" stroke="url(#rimLinear)" stroke-width="16" />

  <!-- YALINIZ Medya Architectural Y Monogram -->
  <g filter="url(#goldGlow)">
    <path
      d="M 98 122 L 202 122 L 256 256 L 310 122 L 414 122 L 298 296 L 298 392 L 214 392 L 214 296 Z"
      fill="url(#goldLinear)"
    />
