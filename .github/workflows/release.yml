name: Automated Release

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps || npm install

      - name: Build Application
        run: npm run build

      - name: Generate Release & Tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force origin || true

          RUN_NUM="${{ github.run_number }}"
          BASE_TAG="v1.0.${RUN_NUM}"
          TAG="$BASE_TAG"
          COUNT=1

          while git rev-parse "$TAG" >/dev/null 2>&1 || git ls-remote --tags origin "refs/tags/$TAG" | grep -q "$TAG"; do
            TAG="${BASE_TAG}.${COUNT}"
            COUNT=$((COUNT + 1))
          done

          echo "Assigning unique release tag: $TAG"

          git tag -a "$TAG" -m "Automated Release $TAG"
          git push origin "$TAG"

          gh release create "$TAG" \
            --title "Release $TAG — ${{ github.event.repository.name }}" \
            --generate-notes \
            --notes "Automated production release artifact generated by YALINIZ CI/CD Pipeline." || \
          gh release edit "$TAG" --title "Release $TAG — ${{ github.event.repository.name }}"
