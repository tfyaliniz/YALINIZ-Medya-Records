<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE5AC"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C1E"/>
      <stop offset="100%" stop-color="#F5D68E"/>
    </linearGradient>
    <linearGradient id="discBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141720"/>
      <stop offset="100%" stop-color="#08090D"/>
    </linearGradient>
    <linearGradient id="prismGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D4"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
  </defs>

  <!-- Circular Bezel -->
  <circle cx="50" cy="50" r="48" fill="url(#goldRim)"/>
  <!-- Obsidian Disc -->
  <circle cx="50" cy="50" r="45.5" fill="url(#discBg)"/>

  <!-- Crisp Platinum White Y Monogram -->
  <g fill="#FFFFFF">
    <polygon points="17,21 35,21 50,46 65,21 83,21 58,50 58,82 42,82 42,50"/>
  </g>
  <!-- Authentic Golden Prism inside cleft -->
  <polygon points="50,22 61,41 39,41" fill="url(#prismGrad)"/>
</svg>